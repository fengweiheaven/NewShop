  <script>
/* Browser-local Excel I/O. No formula execution and no remote requests. */
(function () {
  'use strict';

  const MAX_BYTES = 15 * 1024 * 1024;
  const MAX_ROWS = 30000;
  const MAX_COLS = 100;
  const MAX_SHEETS = 40;
  const XML_LIMIT = 40 * 1024 * 1024;
  const MIME = 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet';
  const NS = 'http://schemas.openxmlformats.org/spreadsheetml/2006/main';
  const REL_NS = 'http://schemas.openxmlformats.org/officeDocument/2006/relationships';

  function zipLibrary() {
    if (!window.JSZip) throw new Error('Excel 组件未加载，请刷新页面后重试。');
    return window.JSZip;
  }

  function cleanText(value) {
    return String(value == null ? '' : value).replace(/[\u0000-\u0008\u000b\u000c\u000e-\u001f\ufffe\uffff]/g, '');
  }

  function xmlEscape(value) {
    return cleanText(value).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&apos;');
  }

  function parseXml(text, label) {
    if (text.length > XML_LIMIT) throw new Error('表格解压后的内容过大，请拆分为较小文件。');
    if (/<!DOCTYPE|<!ENTITY/i.test(text)) throw new Error('文件包含不支持的 XML 声明，请另存为标准 .xlsx 后导入。');
    const doc = new DOMParser().parseFromString(text, 'application/xml');
    if (doc.getElementsByTagName('parsererror').length || doc.getElementsByTagNameNS('*', 'parsererror').length) {
      throw new Error((label || 'Excel') + ' XML 数据损坏，请用 Excel 重新保存后导入。');
    }
    return doc;
  }

  const elements = (node, name) => Array.from(node.getElementsByTagNameNS('*', name));
  const directChildren = (node, name) => Array.from(node.children || []).filter(child => child.localName === name);
  const textOf = (node, name) => { const found = elements(node, name)[0]; return found ? found.textContent || '' : ''; };

  function normalizePath(base, target) {
    if (!target || /^[a-z]+:/i.test(target)) return null;
    const parts = (target.startsWith('/') ? target.slice(1) : base.slice(0, base.lastIndexOf('/') + 1) + target).replace(/\\/g, '/').split('/');
    const result = [];
    for (const part of parts) {
      if (!part || part === '.') continue;
      if (part === '..') { if (!result.length) return null; result.pop(); }
      else result.push(part);
    }
    return result.join('/');
  }

  function columnIndex(reference) {
    const letters = String(reference || '').match(/^\$?([A-Za-z]+)/);
    if (!letters) return -1;
    let index = 0;
    for (const letter of letters[1].toUpperCase()) index = index * 26 + letter.charCodeAt(0) - 64;
    return index - 1;
  }

  function columnName(index) {
    let n = index + 1;
    let result = '';
    while (n > 0) { const rem = (n - 1) % 26; result = String.fromCharCode(65 + rem) + result; n = Math.floor((n - 1) / 26); }
    return result;
  }

  async function readPart(zip, name, required) {
    const entry = name && zip.file(name);
    if (!entry) {
      if (required) throw new Error('Excel 缺少必要的数据文件，请重新保存为 .xlsx 后导入。');
      return null;
    }
    const data = await entry.async('string');
    if (data.length > XML_LIMIT) throw new Error('表格解压后的内容过大，请拆分后导入。');
    return data;
  }

  function dateFormat(code) {
    const stripped = String(code || '').replace(/"[^"]*"/g, '').replace(/\\./g, '').replace(/\[(?!h\]|m\]|s\])[^\]]*\]/gi, '');
    return /[ymd]/i.test(stripped) && !/general|@/i.test(stripped);
  }

  function serialDate(raw, date1904, includeTime) {
    const n = Number(raw);
    if (!Number.isFinite(n) || n < 0 || n > 2958465) return raw;
    const base = Date.UTC(date1904 ? 1904 : 1899, date1904 ? 0 : 11, date1904 ? 1 : 30);
    const date = new Date(base + Math.round(n * 86400000));
    if (Number.isNaN(date.getTime())) return raw;
    const iso = date.toISOString();
    return includeTime && n % 1 ? iso.slice(0, 19).replace('T', ' ') : iso.slice(0, 10);
  }

  function getStyleFormats(stylesText) {
    if (!stylesText) return [];
    const doc = parseXml(stylesText, '样式');
    const custom = new Map(elements(doc, 'numFmt').map(n => [Number(n.getAttribute('numFmtId')), n.getAttribute('formatCode') || '']));
    const cellXfs = elements(doc, 'cellXfs')[0];
    if (!cellXfs) return [];
    const builtInDates = new Set([14, 15, 16, 17, 22, 27, 28, 29, 30, 31, 34, 35, 36, 50, 51, 52, 53, 54, 55, 56, 57, 58]);
    return directChildren(cellXfs, 'xf').map(xf => {
      const id = Number(xf.getAttribute('numFmtId') || 0);
      const code = custom.get(id) || '';
      return { isDate: builtInDates.has(id) || dateFormat(code), includeTime: id === 22 || /h|s/i.test(code.replace(/"[^"]*"/g, '')) };
    });
  }

  function parseSheet(text, sharedStrings, formats, date1904, warnings, name) {
    const doc = parseXml(text, '工作表“' + name + '”');
    const sheetData = elements(doc, 'sheetData')[0];
    const rows = [];
    let maxCol = 0;
    let formulaCount = 0;
    let errorCount = 0;
    let previousRow = -1;
    for (const rowNode of sheetData ? directChildren(sheetData, 'row') : []) {
      const rowAttr = Number(rowNode.getAttribute('r'));
      const rowIndex = rowAttr > 0 ? rowAttr - 1 : previousRow + 1;
      previousRow = rowIndex;
      const cells = directChildren(rowNode, 'c');
      // Excel often stores styled blank rows far below the data. Ignore them.
      const hasContent = cells.some(c => elements(c, 'v').length || elements(c, 'is').length || elements(c, 'f').length);
      if (!hasContent) continue;
      if (rowIndex >= MAX_ROWS) throw new Error('工作表“' + name + '”超出 30,000 行，请拆分后导入。');
      const row = [];
      let previousCol = -1;
      for (const cell of cells) {
        const reference = cell.getAttribute('r');
        const col = reference ? columnIndex(reference) : previousCol + 1;
        previousCol = col;
        if (col < 0) continue;
        const type = cell.getAttribute('t') || '';
        const raw = textOf(cell, 'v');
        const formula = elements(cell, 'f')[0];
        if (formula) formulaCount++;
        let value = raw;
        if (type === 's') value = sharedStrings[Number(raw)] == null ? '' : sharedStrings[Number(raw)];
        else if (type === 'inlineStr') value = elements(cell, 't').map(t => t.textContent || '').join('');
        else if (type === 'b') value = raw === '1' ? 'TRUE' : 'FALSE';
        else if (type === 'e') { value = raw; errorCount++; }
        else if (type === 'd') value = raw;
        else {
          const format = formats[Number(cell.getAttribute('s') || 0)];
          if (format && format.isDate && raw !== '') value = serialDate(raw, date1904, format.includeTime);
          // All remaining numeric cells stay as their raw XML text. Do not round IDs/phones.
        }
        if (col >= MAX_COLS) {
          if (value !== '') throw new Error('工作表“' + name + '”超出 100 列，请删除无关列后导入。');
          continue;
        }
        if (value !== '' || raw !== '') { row[col] = value; maxCol = Math.max(maxCol, col + 1); }
      }
      if (row.some(value => value !== '' && value != null)) rows[rowIndex] = row;
    }
    while (rows.length && !rows[rows.length - 1]) rows.pop();
    for (let i = 0; i < rows.length; i++) {
      const row = rows[i] || [];
      for (let c = 0; c < maxCol; c++) if (row[c] == null) row[c] = '';
      rows[i] = row;
    }
    const widths = [];
    for (const node of elements(doc, 'col')) {
      const min = Math.max(1, Number(node.getAttribute('min')) || 1);
      const max = Math.min(MAX_COLS, Number(node.getAttribute('max')) || min);
      const width = Number(node.getAttribute('width'));
      if (Number.isFinite(width)) for (let c = min - 1; c < max; c++) widths[c] = width;
    }
    if (formulaCount) warnings.push('“' + name + '”含 ' + formulaCount + ' 个公式，已读取文件中保存的计算结果；未执行公式。');
    if (errorCount) warnings.push('“' + name + '”含 ' + errorCount + ' 个 Excel 错误值，请核对后处理。');
    return { name, rows, widths, merges: elements(doc, 'mergeCell').map(n => n.getAttribute('ref') || '') };
  }

  async function readXlsx(file) {
    const JSZip = zipLibrary();
    const bytes = await file.arrayBuffer();
    let zip;
    try { zip = await JSZip.loadAsync(bytes); }
    catch (_) { throw new Error('无法打开此 Excel 文件，可能已损坏、加密或不是标准 .xlsx 格式。'); }
    if (Object.keys(zip.files).length > 5000) throw new Error('工作簿包含过多内部文件，请另存为简化的 .xlsx。');
    let workbookPath = 'xl/workbook.xml';
    const rootRelsText = await readPart(zip, '_rels/.rels', false);
    if (rootRelsText) {
      const rootRels = parseXml(rootRelsText, '工作簿关系');
      const officeDoc = elements(rootRels, 'Relationship').find(r => /\/officeDocument$/.test(r.getAttribute('Type') || ''));
      if (officeDoc && officeDoc.getAttribute('TargetMode') !== 'External') workbookPath = normalizePath('_root', officeDoc.getAttribute('Target')) || workbookPath;
    }
    const workbookText = await readPart(zip, workbookPath, true);
    const workbook = parseXml(workbookText, '工作簿');
    const base = workbookPath.slice(0, workbookPath.lastIndexOf('/') + 1);
    const fileName = workbookPath.slice(workbookPath.lastIndexOf('/') + 1);
    const relsText = await readPart(zip, base + '_rels/' + fileName + '.rels', true);
    const rels = elements(parseXml(relsText, '工作表关系'), 'Relationship');
    const relation = new Map(rels.filter(r => r.getAttribute('TargetMode') !== 'External').map(r => [r.getAttribute('Id'), normalizePath(workbookPath, r.getAttribute('Target'))]));
    const stringRelation = rels.find(r => /\/sharedStrings$/.test(r.getAttribute('Type') || ''));
    const styleRelation = rels.find(r => /\/styles$/.test(r.getAttribute('Type') || ''));
    const stringsText = await readPart(zip, stringRelation ? relation.get(stringRelation.getAttribute('Id')) : base + 'sharedStrings.xml', false);
    const sharedStrings = stringsText ? elements(parseXml(stringsText, '共享文本'), 'si').map(si => elements(si, 't').map(t => t.textContent || '').join('')) : [];
    const formats = getStyleFormats(await readPart(zip, styleRelation ? relation.get(styleRelation.getAttribute('Id')) : base + 'styles.xml', false));
    const properties = elements(workbook, 'workbookPr')[0];
    const date1904 = !!properties && /^(1|true)$/i.test(properties.getAttribute('date1904') || '');
    const sheetNodes = elements(workbook, 'sheet');
    if (sheetNodes.length > MAX_SHEETS) throw new Error('工作簿超过 40 个工作表，请拆分后导入。');
    const sheets = [];
    const warnings = [];
    let totalRows = 0;
    for (const node of sheetNodes) {
      const id = node.getAttributeNS(REL_NS, 'id') || node.getAttribute('r:id');
      const path = relation.get(id);
      const relationNode = rels.find(r => r.getAttribute('Id') === id);
      if (relationNode && !/\/worksheet$/.test(relationNode.getAttribute('Type') || '')) continue;
      if (!path) throw new Error('工作表关系缺失，请用 Excel 重新保存后导入。');
      const sheetText = await readPart(zip, path, true);
      const sheet = parseSheet(sheetText, sharedStrings, formats, date1904, warnings, node.getAttribute('name') || '工作表');
      totalRows += sheet.rows.filter(row => row.some(v => v !== '')).length;
      if (totalRows > MAX_ROWS) throw new Error('工作簿有效数据合计超过 30,000 行，请分批导入。');
      sheets.push(sheet);
    }
    if (!sheets.length) throw new Error('此文件没有可读取的工作表。');
    return { name: file.name, sheets, warnings };
  }

  function parseCsv(text, delimiter) {
    const rows = [];
    let row = [];
    let value = '';
    let quoted = false;
    for (let i = 0; i < text.length; i++) {
      const ch = text[i];
      if (ch === '"') {
        if (quoted && text[i + 1] === '"') { value += '"'; i++; }
        else if (quoted || value === '') quoted = !quoted;
        else value += ch;
      } else if (ch === delimiter && !quoted) {
        row.push(value); value = '';
        if (row.length >= MAX_COLS) throw new Error('CSV 超出 100 列，请删除无关列后导入。');
      } else if ((ch === '\r' || ch === '\n') && !quoted) {
        if (ch === '\r' && text[i + 1] === '\n') i++;
        row.push(value); rows.push(row); row = []; value = '';
        if (rows.length > MAX_ROWS) throw new Error('CSV 超出 30,000 行，请拆分后导入。');
      } else value += ch;
    }
    if (quoted) throw new Error('CSV 中存在未闭合的双引号，请检查文件格式。');
    if (value !== '' || row.length) { row.push(value); rows.push(row); }
    while (rows.length && rows[rows.length - 1].every(v => v.trim() === '')) rows.pop();
    if (rows.length > MAX_ROWS) throw new Error('CSV 超出 30,000 行，请拆分后导入。');
    return rows;
  }

  async function readCsv(file) {
    const bytes = new Uint8Array(await file.arrayBuffer());
    let text;
    try {
      text = bytes[0] === 0xff && bytes[1] === 0xfe ? new TextDecoder('utf-16le', { fatal: true }).decode(bytes) : new TextDecoder('utf-8', { fatal: true }).decode(bytes);
    } catch (_) { throw new Error('CSV 编码无法识别，请另存为“CSV UTF-8”后导入。'); }
    text = text.replace(/^\ufeff/, '');
    const firstLine = text.split(/\r?\n/)[0] || '';
    const candidates = [',', '\t', ';'];
    const delimiter = candidates.sort((a, b) => firstLine.split(b).length - firstLine.split(a).length)[0];
    return { name: file.name, sheets: [{ name: 'CSV', rows: parseCsv(text, delimiter), widths: [] }], warnings: [] };
  }

  async function read(file) {
    if (!file || typeof file.arrayBuffer !== 'function') throw new Error('请选择 Excel 或 CSV 文件。');
    if (file.size > MAX_BYTES) throw new Error('文件超过 15 MB，请拆分后导入。');
    if (!file.size) throw new Error('文件为空，请检查后重新选择。');
    const extension = String(file.name || '').split('.').pop().toLowerCase();
    if (extension === 'csv' || extension === 'tsv') return readCsv(file);
    if (extension === 'xls') throw new Error('暂不支持旧版 .xls，请用 Excel 另存为 .xlsx 后导入。');
    if (extension !== 'xlsx') throw new Error('请选择 .xlsx 或 UTF-8 .csv 文件。');
    return readXlsx(file);
  }

  function detectHeader(rows) {
    const groups = [
      /订单|单号|订单编号|订单号/,
      /商品|产品|货品|品名|sku/i,
      /数量|件数|订购|购买数量|采购数量/,
      /收货|收件|买家|客户/,
      /电话|手机|联系/,
      /地址|省份|城市|区县/,
      /规格|型号|编码|条码/,
      /单价|金额|备注|发货|供应商/
    ];
    let bestIndex = 0;
    let bestScore = -1;
    (rows || []).slice(0, 20).forEach((row, index) => {
      const values = (row || []).map(v => String(v == null ? '' : v).trim()).filter(Boolean);
      if (!values.length) return;
      const short = values.filter(v => v.length <= 24);
      const score = groups.reduce((sum, re) => sum + (short.some(v => re.test(v)) ? 5 : 0), 0) + Math.min(short.length, 16) * 0.3 - values.filter(v => v.length > 60).length;
      if (score > bestScore) { bestScore = score; bestIndex = index; }
    });
    return bestIndex;
  }

  function identifierHeader(header) { return /单号|订单|电话|手机|编码|编号|条码|邮编|身份证|id$|sku/i.test(String(header)); }
  function quantityHeader(header) { return /^(数量|件数|订购数量|购买数量|采购数量|商品数量|发货数量|qty|quantity)$/i.test(String(header).trim()); }

  function defaultWidth(header) {
    const text = String(header || '');
    if (/地址/.test(text)) return 48;
    if (/商品名称|产品名称|货品名称|来源文件|备注/.test(text)) return 32;
    if (/编码|编号|单号|订单|电话|手机/.test(text)) return 25;
    return Math.max(12, Math.min(26, text.length * 2 + 4));
  }

  function cellXml(value, ref, header, isHeader) {
    if (isHeader) return '<c r="' + ref + '" s="1" t="inlineStr"><is><t xml:space="preserve">' + xmlEscape(value) + '</t></is></c>';
    if (value == null || value === '') return '<c r="' + ref + '" s="2"/>';
    if (value instanceof Date && !Number.isNaN(value.getTime())) {
      return '<c r="' + ref + '" s="4"><v>' + (value.getTime() / 86400000 + 25569) + '</v></c>';
    }
    if (!identifierHeader(header)) {
      const isNumeric = typeof value === 'number' || (quantityHeader(header) && /^-?\d+(\.\d+)?$/.test(String(value).trim()));
      const numeric = Number(value);
      if (isNumeric && Number.isFinite(numeric)) return '<c r="' + ref + '" s="3"><v>' + numeric + '</v></c>';
      if (typeof value === 'boolean') return '<c r="' + ref + '" t="b"><v>' + (value ? '1' : '0') + '</v></c>';
    }
    return '<c r="' + ref + '" s="2" t="inlineStr"><is><t xml:space="preserve">' + xmlEscape(value) + '</t></is></c>';
  }

  async function buildWorkbook(options) {
    const { headers, rows = [], widths = [] } = options || {};
    if (!Array.isArray(headers) || !headers.length) throw new Error('请先配置导出列。');
    if (headers.length > MAX_COLS) throw new Error('导出列数不能超过 100 列。');
    if (!Array.isArray(rows) || rows.length > MAX_ROWS) throw new Error('单次最多导出 30,000 行，请分批处理。');
    const JSZip = zipLibrary();
    const zip = new JSZip();
    const name = cleanText(options.sheetName || '订单').replace(/[\\/?*\[\]:]/g, '').replace(/^'+|'+$/g, '').slice(0, 31) || '订单';
    const end = columnName(headers.length - 1) + (rows.length + 1);
    const columnXml = headers.map((h, i) => '<col min="' + (i + 1) + '" max="' + (i + 1) + '" width="' + Math.max(5, Math.min(80, Number(widths[i]) || defaultWidth(h))) + '" customWidth="1"/>').join('');
    const headerXml = '<row r="1" ht="28" customHeight="1">' + headers.map((h, c) => cellXml(h, columnName(c) + '1', h, true)).join('') + '</row>';
    const dataXml = rows.map((row, index) => '<row r="' + (index + 2) + '" ht="22" customHeight="1">' + headers.map((h, c) => cellXml(Array.isArray(row) ? row[c] : row[h], columnName(c) + (index + 2), h, false)).join('') + '</row>').join('');
    zip.file('[Content_Types].xml', '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/></Types>');

  function renderImport(){const s=summary();return `<div class="page-intro"><div><div class="eyebrow">DAILY ORDER WORKSPACE</div><h1>今天的订单，从这里开始</h1><p>批量导入客户表格，确认商品映射，再生成统一订单。</p></div><div class="intro-actions"><button class="btn secondary" id="demo-btn">体验示例</button><button class="btn" id="generate-btn" ${!s.total||s.ready!==s.total-s.excluded||!s.ready?'disabled':''}>生成统一订单 ${icon('arrow')}</button></div></div>${stats()}

  function orderTable(){const rows=visibleOrders();const slice=rows.slice((page-1)*30,page*30);return slice.length?`<div class="table-wrap"><table class="data-table"><thead><tr><th>客户 / 来源</th><th>订单号</th><th>客户商品名称</th><th>数量</th><th>匹配商品 / 供应商编码</th><th>供应商</th><th>状态</th><th class="sticky-action">操作</th></tr></thead><tbody>${slice.map(r=>{const s=status(r),p=s.product,c=suggestion(r);return `<tr class="${s.key==='excluded'?'row-excluded':''}"><td><strong>${esc(r.customer)}</strong><small title="${esc(r.sourceFile)}">${esc(r.sourceSheet)} · 第 ${r.sourceRow} 行</small></td><td class="mono">${esc(r.orderNo||'—')}</td><td class="product-cell">${esc(r.productName||'未填写')}<small>${esc(r.sourceSpec||r.sourceSku||'')}</small></td><td class="numeric">${esc(r.quantity)}</td><td class="product-cell">${p?`${esc(p.name)}<small class="mono">${esc(p.supplierSku)}</small>`:c?`<span class="muted">建议：${esc(c.name)}</span><small class="amber-text">需要确认</small>`:'<span class="muted">尚未关联商品</span>'}</td><td>${esc(p?sById(p.supplierId)?.name:'—')}</td><td>${badge(s)}</td><td class="sticky-action"><button class="text-link" data-edit-order="${esc(r.id)}">${s.key==='ready'?'查看 / 编辑':'处理'}</button></td></tr>`;}).join('')}</tbody></table></div>${pagination(rows.length)}`:`<div class="empty-state">${icon('file')}<h3>${activeRows().length?'没有符合条件的明细':'本次还没有订单'}</h3><p>${activeRows().length?'尝试调整筛选条件或搜索内容。':'导入新订单，或在“选择本次批次 / 历史”中勾选历史批次。'}</p></div>`;}

  function productsTable(){const ps=state.products.filter(p=>(supplierFilter==='all'||p.supplierId===supplierFilter)&&(!query||norm([p.name,p.supplierSku,p.internalSku,...p.aliases.map(a=>a.name||a.code)].join(' ')).includes(norm(query))));return `<div class="table-wrap"><table class="data-table"><thead><tr><th>标准商品</th><th>内部编码</th><th>供应商</th><th>供应商商品编码</th><th>客户别名</th><th>操作</th></tr></thead><tbody>${ps.map(p=>`<tr><td class="product-cell"><strong>${esc(p.name)}</strong><small>${esc(p.spec)} ${esc(p.unit)}</small></td><td class="mono">${esc(p.internalSku)}</td><td>${esc(sById(p.supplierId)?.name||'未设置')}</td><td class="mono">${esc(p.supplierSku)}</td><td><span class="pill ${p.aliases.length?'success':'neutral'}">${p.aliases.length} 条别名</span><small>${esc(p.aliases[0]?.name||'待确认客户叫法')}</small></td><td><button class="text-link" data-edit-product="${esc(p.id)}">编辑</button></td></tr>`).join('')||'<tr><td colspan="6" class="empty-cell">没有找到商品，请新增或调整筛选。</td></tr>'}</tbody></table></div>`;}
  function renderUnified(){const s=summary(),u=state.unified;return `<div class="page-intro"><div><div class="eyebrow">STANDARD ORDERS</div><h1>一张表，连接所有订单</h1><p>统一格式保留客户、商品、供应商和原始来源，不合并不同收件人的明细。</p></div><div class="intro-actions"><button class="btn secondary" data-go="import">返回处理订单</button>${u?`<button class="btn" id="download-unified">${icon('download')} 下载统一订单</button>`:`<button class="btn" id="generate-btn" ${!s.ready||s.ready!==s.total-s.excluded?'disabled':''}>生成统一订单</button>`}</div></div>${u?`<div class="alert success">${icon('check')} 已生成 ${u.rows.length} 条标准明细，共 ${u.rows.reduce((n,r)=>n+Number(r.quantity),0)} 件 · ${new Date(u.createdAt).toLocaleString('zh-CN',{timeZone:'Asia/Shanghai'})}</div><section class="card"><div class="card-header"><h2>统一订单预览</h2><button class="btn small" data-go="export">按供应商拆分 ${icon('arrow')}</button></div>${unifiedTable(u.rows)}</section><p class="page-footnote">修改订单、商品映射或供应商信息后，需要重新生成统一订单。来源缺少单价时保留空白。</p>`:`<section class="card"><div class="empty-state">${icon('file')}<h3>先完成订单检查，再生成统一表</h3><p>${s.total?`当前 ${s.ready} 条已就绪，${s.total-s.ready-s.excluded} 条待处理，${s.excluded} 条已排除。`:'先导入客户订单，再确认商品与供应商映射。'}</p><button class="btn secondary" data-go="import">前往订单采集与匹配</button></div></section>`}`;}

ary"><span>${icon('check')} 仅导出本次选中批次的明细，模板原有示例订单不会混入。</span><span>预览前 10 行，完整导出 ${g.rows.length} 条。</span></div></section></div>`}<section class="card template-management"><div class="card-header"><h2>供应商模板管理</h2><span class="muted">支持上传新模板并逐列配置</span></div><div class="card-body template-list">${state.suppliers.map(s=>`<div><span>${icon('file')}<strong>${esc(s.name)}</strong><small>${esc(s.template?.name||'待配置')}</small></span><button class="btn secondary small" data-template="${esc(s.id)}">配置模板</button></div>`).join('')}</div></section>`;}

  async function queueFiles(files){if(!files?.length)return;const list=Array.from(files);if(list.length>30){toast('每次最多导入30个文件。','warning');return;}let failed=0;for(const f of list){try{if(f.size>15*1024*1024)throw Error('文件超过15MB');const ab=await f.arrayBuffer();const hash=Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',ab))).map(v=>v.toString(16).padStart(2,'0')).join('');if(state.batches.some(b=>b.hash===hash)||pending.some(p=>p.hash===hash)){toast(`已跳过重复文件：${f.name}`,'warning');continue;}const book=await OrderExcel.read(f);pending.push({book,hash});}catch(e){failed++;toast(`${f.name}：${e.message}`,'warning');}}if(pending.length)nextImport();else if(!failed)toast('所选文件已导入过。','warning');}

  function templateModal(sid,override=null){const supplier=sById(sid);if(!supplier)return;const t=copy(override||supplier.template||{name:'自定义模板',sheetName:'Sheet1',columns:copy(OrderSeed.supplier.template.columns)});openModal(`${supplier.name} · 订单模板设置`,`<div class="template-top"><div><strong>${esc(t.name)}</strong><p class="muted">逐列指定导出内容。只读取上传模板的表头，不带入示例订单。</p></div><button class="btn secondary small" id="upload-template">上传 Excel 模板</button><input id="template-file" type="file" accept=".xlsx,.csv" hidden></div><form id="template-form"><div class="form-grid">${field('模板名称','templateName',t.name,{required:true})}${field('导出工作表名称','sheetName',t.sheetName||'Sheet1',{required:true})}</div><div class="table-wrap"><table class="data-table template-table"><thead><tr><th>输出列名</th><th>取值来源</th><th>缺失时默认值 / 固定值</th><th>必填</th></tr></thead><tbody>${t.columns.map((c,i)=>`<tr><td><input name="header-${i}" value="${esc(c.header)}" aria-label="第${i+1}列名称"></td><td><select name="field-${i}" aria-label="${esc(c.header)}取值来源">${EXPORT_FIELDS.map(([k,l])=>`<option value="${k}" ${k===c.field?'selected':''}>${l}</option>`).join('')}</select></td><td><input name="fallback-${i}" value="${esc(c.fallback||'')}" aria-label="${esc(c.header)}默认值"></td><td><input type="checkbox" name="required-${i}" ${c.required?'checked':''} aria-label="${esc(c.header)}为必填"></td></tr>`).join('')}</tbody></table></div><p class="muted">友本要求的列顺序为：订单号、买家昵称、收货人、详细地址、收货人电话、商品编码、数量。未提供买家昵称时，默认留空。</p><p class="form-error" id="template-error"></p></form>`,`<button class="btn secondary" data-cancel>取消</button><button class="btn" id="save-template">保存模板配置</button>`,true);
    $('#upload-template').onclick=()=>$('#template-file').click();$('#template-file').onchange=e=>guardAsync(async()=>{const file=e.target.files[0];if(!file)return;const book=await OrderExcel.read(file);let si=0,hi=OrderExcel.detectHeader(book.sheets[0].rows);const showPicker=()=>{const sh=book.sheets[si],headers=sh.rows[hi]||[];openModal('选择供应商模板表头',`<div class="form-grid">${selectField('模板工作表','templateSheet',book.sheets.map((s,i)=>[i,s.name]),si)}${field('表头行','templateHeader',hi+1,{type:'number'})}</div><p class="muted">将使用下列 ${headers.length} 列生成新订单文件，表头上方的说明及原有数据行不会复制。</p><div class="template-header-chips">${headers.map(h=>`<span class="pill neutral">${esc(h||'空白列')}</span>`).join('')}</div>`,`<button class="btn secondary" data-cancel>取消</button><button class="btn" id="apply-template">使用这些列</button>`);$('[name=templateSheet]').onchange=e=>{si=Number(e.target.value);hi=OrderExcel.detectHeader(book.sheets[si].rows);showPicker();};$('[name=templateHeader]').onchange=e=>{const n=Number(e.target.value);if(Number.isInteger(n)&&n>0&&n<=Math.min(20,sh.rows.length)){hi=n-1;showPicker();}else toast('请输入有效表头行。','warning');};$('#apply-template').onclick=()=>{if(!headers.length||headers.some(h=>!String(h??'').trim())){toast('表头包含空白列，请选择完整表头或整理模板后再上传。','warning');return;}const cols=headers.map(h=>{const n=norm(h);let field='blank';if(['商品编码','sku码','sku','供应商商品编码'].map(norm).includes(n))field='supplierSku';else{const f=FIELDS.find(([,l,names])=>norm(l)===n||names.some(x=>norm(x)===n));field=f?.[0]||'blank';if(field==='sourceSku')field='supplierSku';}return {header:String(h),field,required:['orderNo','recipient','phone','address','supplierSku','quantity'].includes(field),fallback:''};});templateModal(sid,{name:file.name,sheetName:sh.name,columns:cols,widths:sh.widths||[]});};};showPicker();});
    $('#save-template').onclick=async()=>{const f=new FormData($('#template-form'));const columns=t.columns.map((c,i)=>({header:String(f.get(`header-${i}`)||'').trim(),field:f.get(`field-${i}`),fallback:String(f.get(`fallback-${i}`)||''),required:f.has(`required-${i}`)}));if(columns.some(c=>!c.header)){ $('#template-error').textContent='所有输出列名都不能为空。';return;}if(new Set(columns.map(c=>c.header)).size!==columns.length){$('#template-error').textContent='输出列名不能重复。';return;}if(!f.get('templateName')?.trim()||!f.get('sheetName')?.trim()){$('#template-error').textContent='请填写模板和工作表名称。';return;}if(columns.some(c=>c.required&&c.field==='blank'&&!c.fallback)){$('#template-error').textContent='必填列不能设为留空，请选择取值来源。';return;}supplier.template={name:f.get('templateName').trim(),sheetName:f.get('sheetName').trim(),columns,widths:t.widths};history('更新供应商模板');await save();closeModal();render();toast('模板配置已保存。');};
  }
  async function generateUnified(){const s=summary();if(!s.ready||s.ready!==s.total-s.excluded){toast('请先处理全部映射、重复和字段问题，或明确排除对应行。','warning');return;}const rows=activeRows().filter(r=>status(r).key==='ready').map(r=>{const p=status(r).product,s=sById(p.supplierId);return {...copy(r),sourceProductName:r.productName,productName:p.name,internalSku:p.internalSku,spec:p.spec,supplierId:s.id,supplierName:s.name,supplierSku:p.supplierSku,quantity:Number(r.quantity),unitPrice:r.unitPrice===''?'':Number(r.unitPrice)||r.unitPrice};});state.unified={createdAt:new Date().toISOString(),batchIds:[...state.activeBatchIds],rows};history(`生成 ${rows.length} 条统一订单`);await save();view='unified';render();toast(`已生成 ${rows.length} 条统一订单。`);}
  const safeName=s=>s.replace(/[<>:"/\\|?*\x00-\x1f]/g,'_').slice(0,70)||'供应商';
  async function exportBytes(g){const errs=exportIssues(g);if(errs.length)throw Error(errs.join('；'));const t=g.supplier.template;return OrderExcel.buildWorkbook({headers:t.columns.map(c=>c.header),rows:g.rows.map(r=>t.columns.map(c=>templateValue(r,c))),sheetName:t.sheetName||'Sheet1',widths:t.widths});}
  async function exportOne(g){if(!g)return;const bytes=await exportBytes(g);OrderExcel.downloadBlob(new Blob([bytes],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}),`${safeName(g.supplier.name)}_导单_${stamp()}.xlsx`);markExported(g.rows);history(`导出 ${g.supplier.name} ${g.rows.length} 行`);await save();toast('供应商订单已导出。');}
  async function exportAll(){const zip=new JSZip(),gs=exportGroups();if(!gs.length)return;for(let i=0;i<gs.length;i++){const g=gs[i],bytes=await exportBytes(g);zip.file(`${String(i+1).padStart(2,'0')}_${safeName(g.supplier.name)}_导单_${stamp()}.xlsx`,bytes);}const blob=await zip.generateAsync({type:'blob',compression:'DEFLATE'});OrderExcel.downloadBlob(blob,`供应商订单_${stamp()}.zip`);markExported(gs.flatMap(g=>g.rows));history(`批量导出 ${gs.length} 家供应商`);await save();toast(`已打包 ${gs.length} 家供应商的订单。`);}
  function manageBatches(){
    openModal('本次处理批次与历史',`<p class="muted">仅勾选的批次参与本次订单检查与统一订单生成。导出记录会保留；下次导入新文件时，已完整导出的旧批次会自动移出本次范围。</p>${state.batches.map(b=>`<div class="batch-row"><label class="checkbox-row"><input type="checkbox" data-scope-batch="${esc(b.id)}" ${state.activeBatchIds.includes(b.id)?'checked':''}><span><strong>${esc(b.name)}</strong><small>${esc(b.customer)} · ${state.orders.filter(r=>r.batchId===b.id).length} 行 · ${b.exportedAt?'已完整导出':'尚未完整导出'}</small></span></label><button class="btn danger small" data-delete-batch="${esc(b.id)}">删除</button></div>`).join('')}`,`<button class="btn secondary" data-cancel>关闭</button>`,true);
    $$('[data-scope-batch]').forEach(el=>el.onchange=async()=>{const id=el.dataset.scopeBatch;state.activeBatchIds=state.activeBatchIds.filter(bid=>bid!==id);if(el.checked)state.activeBatchIds.push(id);page=1;invalidate();await save();render();});
    $$('[data-delete-batch]').forEach(b=>b.onclick=()=>{const batch=state.batches.find(x=>x.id===b.dataset.deleteBatch);confirmDialog('删除订单批次',`确认删除“${batch.name}”及其订单明细？`,async()=>{const ids=new Set(state.orders.filter(r=>r.batchId===batch.id).map(r=>r.id));state.orders=state.orders.filter(r=>r.batchId!==batch.id);state.orders.forEach(r=>{if(ids.has(r.duplicateOf))delete r.duplicateOf;});state.batches=state.batches.filter(x=>x.id!==batch.id);state.activeBatchIds=state.activeBatchIds.filter(id=>id!==batch.id);invalidate();await save();render();toast('批次已删除。');});});
  }
  async function loadDemo(){if(state.batches.some(b=>b.demo)){toast('演示数据已经载入，可在“管理导入批次”中删除。','warning');return;}const add=async()=>{const id=uid();state.batches.push({id,name:'演示订单（模拟数据）.xlsx',customer:'演示客户',hash:'demo-'+id,demo:true,createdAt:new Date().toISOString()});for(let i=0;i<6;i++){const c=OrderSeed.candidates[i<2?0:i<5?1:2];state.orders.push({id:uid(),batchId:id,customer:c.customer,orderNo:'DEMO-'+String(i+1).padStart(4,'0'),productName:c.name,sourceSku:c.sourceSku||'',sourceSpec:c.customer==='GBH'?'早餐代餐':'',sourceLineId:'demo-'+i,quantity:1,recipient:'模拟收件人'+(i+1),phone:'1380000000'+i,address:'示例省示例市示例区演示路'+(i+1)+'号（模拟地址）',buyerNickname:'',remark:'模拟数据，请勿实际发货',date:stamp(),unitPrice:'',sourceFile:'演示订单（模拟数据）.xlsx',sourceSheet:'模拟数据',sourceRow:i+2,excluded:false,manual:false,raw:{说明:'模拟数据，请勿实际发货'}});}includeNewBatch(id);invalidate();await save();render();toast('已载入6条模拟订单，请确认商品映射。');};if(activeRows().length)confirmDialog('加入演示订单','将新增6条模拟订单，可在批次管理中删除。本次选中的批次会一同参与后续生成。',add);else await add();}
  window.OrderFlow={getState:()=>copy(state),status,summary,generateUnified,findProducts,validateBackup,exportIssues,templateValue,UNIFIED,autoMap,activeRows,duplicateKey};
  document.readyState==='loading'?document.addEventListener('DOMContentLoaded',init):init();
})();
